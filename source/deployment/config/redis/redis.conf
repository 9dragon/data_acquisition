# Redis 配置文件

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 守护进程模式（Docker环境设为no）
daemonize no

# 数据库数量
databases 16

# 持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB配置
save 900 1
save 300 10
save 60 10000

# 数据目录
dir /data

# 日志级别
loglevel notice

# 最大内存（根据实际情况调整）
# maxmemory 1gb
# maxmemory-policy allkeys-lru

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128
